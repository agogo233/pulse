name: Portable build (Win x64)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      PDFIUM_USE_PREBUILT:
        description: '应急回退：true 用 git 入库的预编译 pdfium.dll；默认 false，严格从 pdfium-<version> 发布取源构建产物'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pulse-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  portable:
    runs-on: windows-2022
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Fetch source-built PDFium
        if: ${{ !inputs.PDFIUM_USE_PREBUILT }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $v = (Get-Content third_party/pdfium/VERSION | ForEach-Object { ($_ -split '=')[1] }) -join '.'
          if ($v -notmatch '^\d+\.\d+\.\d+\.\d+$') { throw "Unexpected PDFium version: $v" }
          $tag = "pdfium-$v"
          $zip = "pdfium-$v.zip"
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern $zip
          if (-not (Test-Path $zip)) { throw "Source-built PDFium asset not found: $tag" }
          Expand-Archive $zip -DestinationPath third_party/pdfium -Force
          if (-not (Test-Path third_party/pdfium/bin/pdfium.dll)) {
            throw 'Source-built pdfium.dll missing after extraction'
          }
          Write-Output "Using source-built PDFium $v from release $tag"
      - name: Build release payload (skip test suite)
        shell: pwsh
        run: ./scripts/build_release_ci.ps1 -Channel windows -SkipTests
      - name: Stage portable payload
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content version.txt -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Unexpected version.txt content: $version" }
          "PULSE_VERSION=$version" >> $env:GITHUB_ENV
          # Keep in sync with tools/pack_installer/pack_installer.py DEFAULT_LAYOUT.
          $binaries = @('pulse.exe', 'Pulse.AI.exe', 'Pulse.Content.exe', 'Pulse.Document.exe',
            'Pulse.Index.exe', 'Pulse.Preview.exe', 'pulse_elevated.exe', 'pulse_hotkey_broker.exe',
            'pulse_shell.exe', 'pulse_start_pin.dll', 'pulse_integration.exe', 'lumatext.dll', 'pdfium.dll')
          $stage = 'dist/portable-win-x64'
          New-Item -ItemType Directory -Force $stage | Out-Null
          foreach ($binary in $binaries) {
            $source = Join-Path 'build-ci' $binary
            if (-not (Test-Path $source)) { throw "Missing portable payload file: $binary" }
            Copy-Item $source $stage -Force
          }
          $manifest = Get-ChildItem $stage -File | Sort-Object Name | ForEach-Object {
            $stream = [IO.File]::OpenRead($_.FullName)
            $sha256 = [Security.Cryptography.SHA256]::Create()
            try { $hash = [BitConverter]::ToString($sha256.ComputeHash($stream)).Replace('-', '') }
            finally { $stream.Dispose(); $sha256.Dispose() }
            [pscustomobject]@{ name = $_.Name; sha256 = $hash }
          }
          ConvertTo-Json -InputObject @{ version = $version; files = @($manifest) } |
            Set-Content (Join-Path $stage 'SHA256SUMS.json') -Encoding UTF8
          Write-Output "Staged $($manifest.Count) portable binaries for Pulse $version"
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-${{ env.PULSE_VERSION }}-portable-win-x64
          path: dist/portable-win-x64/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Pulse-${{ env.PULSE_VERSION }}-installer
          path: dist/PulseSetup-*.exe
          retention-days: 7
          if-no-files-found: error
